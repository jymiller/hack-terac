services:
  - type: web
    name: hack-terac
    runtime: node
    repo: https://github.com/jymiller/hack-terac
    region: oregon
    # Free to avoid a payment gate during the event. Free services spin down after
    # 15 minutes idle and take about a minute to wake, so upgrade to `starter` before
    # anyone is asked to sit and watch it load.
    plan: free
    branch: main
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: APP_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PAYMENT_LINK
        sync: false
      - key: TERAC_API_KEY
        sync: false
      - key: TERAC_BASE_URL
        value: https://terac.com/api/external/v2
